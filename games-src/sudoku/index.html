<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku — Play Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Sudoku</h1>
  <p class="subtitle">Fill the grid so every row, column and 3&times;3 box holds 1&ndash;9</p>

  <div class="controls">
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
      <option value="very-hard">Very hard</option>
      <option value="insane">Insane</option>
    </select>
    <button id="new-game" type="button">New puzzle</button>
    <button id="check" type="button">Check</button>
    <button id="solve" type="button">Solve</button>
    <button id="clear" type="button">Clear</button>
  </div>

  <div id="board" class="board" aria-label="Sudoku board"></div>

  <div id="status" role="status"></div>

  <div class="numpad">
    <button type="button" data-n="1">1</button>
    <button type="button" data-n="2">2</button>
    <button type="button" data-n="3">3</button>
    <button type="button" data-n="4">4</button>
    <button type="button" data-n="5">5</button>
    <button type="button" data-n="6">6</button>
    <button type="button" data-n="7">7</button>
    <button type="button" data-n="8">8</button>
    <button type="button" data-n="9">9</button>
    <button type="button" id="erase" class="erase">Erase</button>
  </div>

  <p class="attribution">
    Puzzle engine: sudoku.js by Robert McGuire (MIT) &middot; Interface: original to this site
  </p>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
