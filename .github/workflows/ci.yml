name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Validate, type-check, test and build
    runs-on: ubuntu-latest

    # The AdSense publisher ID is public — it is served verbatim in /ads.txt and
    # inside every page's <head> — so it is safe to pin here. It matters because
    # `scripts/validate-ads.mjs` decides what to assert from two facts: the
    # master switch and whether credentials exist. Without this variable CI would
    # build the "no publisher ID" shape, where the correct output is zero ad
    # tokens — proving nothing about what production actually ships.
    #
    # With it set, CI builds the production shape: exactly one AdSense loader per
    # page and zero ad slots in the delivered markup (ads stay off until approval).
    env:
      PUBLIC_ADSENSE_PUB_ID: ca-pub-4356925414992622

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # T04: the daily generator must be deterministic (same input → same
      # output) and idempotent (a second run writes nothing). We prove both by
      # running it twice against a fixed date, then restore the tree so the
      # rest of the pipeline sees a pristine checkout.
      - name: Verify daily generator idempotency
        run: |
          set -euo pipefail
          D=2026-08-04
          rm -f src/content/blog/auto-${D}-*.md src/content/data/last-auto-run.json
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-1.txt
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-2.txt
          grep -q "GENERATED: 0 file" /tmp/gen-2.txt
          rm -f src/content/blog/auto-${D}-*.md
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-3.txt
          diff /tmp/gen-1.txt /tmp/gen-3.txt
          node scripts/validate-content.mjs
          git checkout -- . 2>/dev/null || true
          rm -f src/content/blog/auto-${D}-*.md
          echo "Generator is deterministic and idempotent; generated drafts pass validation."

      - name: Unit tests
        run: npm test

      - name: Type-check Astro templates
        run: npx astro check

      # `npm run build` chains prebuild (content validation + game sync) and
      # postbuild (deploy budget report) automatically.
      - name: Build site
        run: npm run build

      # Single source of truth for ad-output policy. The three modes and their
      # assertions live in the script, not here: duplicating the rule as a grep
      # in this file is what made the two disagree in the first place.
      - name: Validate ad output
        run: node scripts/validate-ads.mjs

      - name: Warn when content and page templates change together
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q '^src/content/games/' && echo "$CHANGED" | grep -q '^src/pages/'; then
            echo "::warning::This PR changes both game content and page templates. Adding a game should not require template changes."
          fi
