name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Validate, type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # T04: the daily generator must be deterministic (same input → same
      # output) and idempotent (a second run writes nothing). We prove both by
      # running it twice against a fixed date, then restore the tree so the
      # rest of the pipeline sees a pristine checkout.
      - name: Verify daily generator idempotency
        run: |
          set -euo pipefail
          D=2026-08-04
          rm -f src/content/blog/auto-${D}-*.md src/content/data/last-auto-run.json
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-1.txt
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-2.txt
          grep -q "GENERATED: 0 file" /tmp/gen-2.txt
          rm -f src/content/blog/auto-${D}-*.md
          node scripts/generate-daily-posts.mjs --type all --date ${D} > /tmp/gen-3.txt
          diff /tmp/gen-1.txt /tmp/gen-3.txt
          node scripts/validate-content.mjs
          git checkout -- . 2>/dev/null || true
          rm -f src/content/blog/auto-${D}-*.md
          echo "Generator is deterministic and idempotent; generated drafts pass validation."

      - name: Unit tests
        run: npm test

      - name: Type-check Astro templates
        run: npx astro check

      # `npm run build` chains prebuild (content + ad policy validation)
      # and postbuild (deploy budget report) automatically.
      - name: Build site
        run: npm run build

      - name: Assert no ad code ships while ads are disabled
        run: |
          COUNT=$(grep -rEl "adsbygoogle|pagead2" dist/ 2>/dev/null | wc -l)
          echo "Files containing ad markers: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Ads are disabled in src/config/ads.ts but ad code was found in dist/."
            grep -rEl "adsbygoogle|pagead2" dist/ || true
            exit 1
          fi

      - name: Warn when content and page templates change together
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q '^src/content/games/' && echo "$CHANGED" | grep -q '^src/pages/'; then
            echo "::warning::This PR changes both game content and page templates. Adding a game should not require template changes."
          fi
